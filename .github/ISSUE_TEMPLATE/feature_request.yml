name: Feature request
description: Suggest an improvement to Efficient Quests.
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed experience
      description: Describe how the improvement would help a player.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context

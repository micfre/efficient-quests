name: CI

on:
  push:
  pull_request:

jobs:
  offline-suites:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Run the Lua suites in Docker
        run: |
          for suite in runtime saveddata queststate characterstore datastore routeplanner questiefallback options menu manifest; do
            docker run --rm -v "$PWD:/w" -w /w nickblah/lua:5.1 lua "tests/$suite.lua"
          done
      - name: Run luacheck on the addon code
        run: docker run --rm -v "$PWD:/w" -w /w pipelinecomponents/luacheck luacheck dist/EfficientQuests
